name: Publish (manual)

# Manual release pipeline. It is kept REGISTERED/visible by triggering on PRs into
# and pushes to master — but on those events every job is gated to workflow_dispatch,
# so they all SKIP (the run shows "Skipped", never a green "deployed" check). A real
# publish only happens when you manually run it from the Actions tab ("Run workflow")
# and choose a dist-tag. On dispatch it re-runs test + audit + dry-run as a final
# guard, then publishes to npm and cuts a GitHub Release whose notes are generated by
# ledger itself, built from source (no npm), via AWS Bedrock.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag to publish under ('latest' for a stable release, 'beta'/'next' for a prerelease)"
        required: true
        default: 'latest'

# Prevent overlapping publishes.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml

  audit:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/audit.yml

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, audit]
    uses: ./.github/workflows/dryrun.yml
    secrets: inherit

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + tag
      id-token: write # npm provenance (publishConfig.provenance = true)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: needed to derive the notes range and verify the tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        run: |
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.pkg.outputs.version }} already exists. Bump the version first."
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.dist-tag }}"

      # Dogfood: generate this release's notes with ledger ITSELF, run from the freshly
      # built source (dist/cli.js) — NOT the published npm package. The range is left to
      # ledger's own --since-last-tag resolution: previous tag → HEAD normally (the new tag
      # isn't created until the next step), and the whole history including the root commit
      # on a first release. Do NOT re-derive the range in shell here — anchoring to the root
      # commit is wrong, because `<root>..HEAD` is half-open and silently drops the root
      # commit and the entire initial import (and is completely empty in a single-commit
      # repo, which is what made first releases always fall through to the fallback below).
      # The notes are written to the runner's temp dir ($RUNNER_TEMP), NOT the repo — it is
      # a throwaway file passed to `gh release create`; nothing is committed or pushed.
      # Uses AWS Bedrock; set the BEDROCK_API_KEY secret (and optionally AWS_REGION /
      # LEDGER_MODEL repo variables). If the key is missing or generation fails, we fall
      # back to GitHub's auto-generated notes so a publish is never blocked by note generation.
      - name: Generate release notes from source
        id: notes
        env:
          LEDGER_PROVIDER: bedrock
          LEDGER_MODEL: ${{ vars.LEDGER_MODEL }} # optional; empty = provider default
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }} # optional; ledger defaults to us-east-1
        run: |
          set -uo pipefail
          notes_file="$RUNNER_TEMP/RELEASE_NOTES.md"
          echo "notes-file=$notes_file" >> "$GITHUB_OUTPUT"

          if [ -z "${BEDROCK_API_KEY:-}" ]; then
            echo "::warning::BEDROCK_API_KEY not set — falling back to GitHub auto-generated notes."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --fail-on-empty so an empty range is a loud failure into the fallback rather
          # than a silent exit-0 that writes no file. ledger logs the range it resolved.
          if node dist/cli.js generate \
               --since-last-tag \
               --to HEAD \
               --output-file "$notes_file" \
               --fail-on-empty \
             && [ -s "$notes_file" ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ledger note generation failed — falling back to GitHub auto-generated notes."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      # Tag is derived from the package.json version (v<version>). Uses the ledger-generated
      # notes when available, otherwise GitHub's auto notes. A prerelease version (containing a
      # hyphen, e.g. -beta) is marked as a GitHub pre-release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.pkg.outputs.version }}"
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          if [ "${{ steps.notes.outputs.generated }}" = "true" ]; then
            gh release create "v${version}" \
              --title "v${version}" \
              --notes-file "${{ steps.notes.outputs.notes-file }}" \
              --target "${{ github.sha }}" \
              $prerelease
          else
            gh release create "v${version}" \
              --title "v${version}" \
              --generate-notes \
              --target "${{ github.sha }}" \
              $prerelease
          fi
