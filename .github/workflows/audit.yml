name: Audit

# Reusable building block (workflow_call) — invoked by ci.yml on every push/PR and
# by publish.yml before a release. Also runs standalone weekly. The package ships
# zero of its dev tooling, so the production audit should always be clean.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=critical || true
