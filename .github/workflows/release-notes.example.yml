# Example: generate release notes on every version tag using the composite action.
# Copy this into your own repo's .github/workflows/ and set the provider secret.
name: Release Notes (example)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the range can be derived

      # Beta: pin the action to the beta tag and run the beta build. At stable v1,
      # use `anishhs-gh/ledger@v1` and drop the `package:` override.
      - uses: anishhs-gh/ledger@v1.0.0-beta.0
        with:
          provider: openai
          api-key: ${{ secrets.OPENAI_API_KEY }}
          output-file: RELEASE_NOTES.md
          package: '@anishhs/ledger@beta'
          # args: '--audience business'   # any extra flags

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
