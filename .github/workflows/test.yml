name: Test

# Reusable building block (workflow_call) — invoked by ci.yml on every push/PR and
# by publish.yml before a release. Not triggered standalone on push/PR, so it never
# runs twice for the same event.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (CJS + ESM)
        run: npm run build

      - name: Test
        run: npm test
