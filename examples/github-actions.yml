# Example: generate release notes on every version tag using the composite action.
# Copy this into your own repo's .github/workflows/ and set the provider secret.
# Provider and model come from the ledger.config.yaml committed to your repo (run `ledger init`).
name: Release Notes (example)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the range can be derived

      # Pin to the floating `@v1` tag, or a specific release like `anishhs-gh/ledger@v1.0.0`.
      - uses: anishhs-gh/ledger@v1
        with:
          api-key: ${{ secrets.OPENAI_API_KEY }}   # the only secret; provider/model from ledger.config.yaml
          output-file: RELEASE_NOTES.md
          # args: '--audience business'   # any extra flags

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
